<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Z-Report — Restaurant POS</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="navbar"></div>

  <div class="page-body narrow">
    <div class="page-header">
      <div>
        <h2>Z-Report</h2>
        <div class="subtitle">Immutable end-of-day closeout — once generated, a report is archived and never recalculated.</div>
      </div>
    </div>

    <div class="card" id="generateCard" style="padding:18px; margin-bottom:24px; display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end;">
      <div>
        <div style="font-size:12px; font-weight:600; margin-bottom:4px;">From</div>
        <input id="fromDate" type="date" />
      </div>
      <div>
        <div style="font-size:12px; font-weight:600; margin-bottom:4px;">To (exclusive)</div>
        <input id="toDate" type="date" />
      </div>
      <button id="todayBtn" class="btn">Today</button>
      <button id="generateBtn" class="btn btn-primary">Generate Z-Report</button>
    </div>

    <h3 style="margin-bottom:10px;">Past Reports</h3>
    <div id="reportList" style="display:flex; flex-direction:column; gap:10px;"></div>
  </div>

  <div id="toast" class="toast"></div>
  <script src="auth.js"></script>
  <script src="theme.js"></script>
  <script src="nav.js"></script>
  <script src="zreport.js"></script>
</body>
</html>
