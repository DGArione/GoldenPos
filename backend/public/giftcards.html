<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Gift Cards — Restaurant POS</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="navbar"></div>
  <div class="page-body">
    <div class="page-header">
      <div>
        <h2>Gift Cards</h2>
      </div>
      <button id="newCardBtn" class="btn btn-primary">Issue a card</button>
    </div>

    <div id="gcReport" style="display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:12px; margin-bottom:22px;"></div>

    <input id="gcSearch" placeholder="🔍 Search by code or recipient…" style="width:100%; max-width:420px; margin-bottom:16px;" />
    <div id="gcList"></div>
  </div>
  <div id="toast" class="toast"></div>
  <script src="auth.js"></script>
  <script src="theme.js"></script>
  <script src="nav.js"></script>
  <script src="barcode.js"></script>
  <script src="giftcards.js"></script>
</body>
</html>
