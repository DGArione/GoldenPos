<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Messages — Restaurant POS</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="navbar"></div>

  <div class="page-body page-body--fullscreen" style="flex-direction:row;">
    <div style="width:320px; flex-shrink:0; border-right:1px solid var(--border); display:flex; flex-direction:column;">
      <div style="padding:16px 18px; border-bottom:1px solid var(--border-soft); display:flex; justify-content:space-between; align-items:center;">
        <strong style="font-size:15px;">Messages</strong>
        <button id="newMessageBtn" class="btn btn-primary" style="font-size:12px; padding:6px 10px;">+ New</button>
      </div>
      <div id="threadList" style="flex:1; overflow-y:auto;"></div>
    </div>

    <div style="flex:1; display:flex; flex-direction:column;">
      <div id="emptyState" class="empty-state" style="margin:auto;">Select a conversation, or start a new one.</div>
      <div id="threadView" style="display:none; flex:1; flex-direction:column; height:100%;">
        <div id="threadHeader" style="padding:16px 22px; border-bottom:1px solid var(--border);"></div>
        <div id="threadMessages" style="flex:1; overflow-y:auto; padding:18px 22px; display:flex; flex-direction:column; gap:12px;"></div>
        <div style="padding:14px 22px; border-top:1px solid var(--border); display:flex; gap:8px;">
          <input id="replyInput" placeholder="Type a reply..." style="flex:1;" />
          <button id="sendReplyBtn" class="btn btn-primary">Send</button>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>
  <script src="auth.js"></script>
  <script src="theme.js"></script>
  <script src="nav.js"></script>
  <script src="messages.js"></script>
</body>
</html>
