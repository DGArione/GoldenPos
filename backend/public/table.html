<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Order — Restaurant</title>
<link rel="stylesheet" href="/style.css" />
<style>
  body { background: var(--bg); }
  .t-wrap { max-width: 640px; margin: 0 auto; padding: 0 0 120px; }
  .t-header { position: sticky; top: 0; z-index: 10; background: var(--panel); border-bottom: 1px solid var(--border);
    padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .t-header .biz { font-weight: 700; font-size: 16px; }
  .t-header .tbl { font-size: 12px; color: var(--muted); }
  .t-chips { display: flex; gap: 8px; overflow-x: auto; padding: 12px 18px; position: sticky; top: 56px; background: var(--bg); z-index: 9; }
  .t-chip { white-space: nowrap; border: 1px solid var(--border); background: var(--panel); color: var(--text);
    border-radius: 999px; padding: 7px 14px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .t-chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .t-item { display: flex; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--border-soft); align-items: center; }
  .t-item .thumb { width: 56px; height: 56px; border-radius: 12px; background: var(--neutral-bg); flex-shrink: 0;
    background-size: cover; background-position: center; }
  .t-item .info { flex: 1; min-width: 0; }
  .t-item .nm { font-weight: 600; font-size: 15px; }
  .t-item .pr { color: var(--accent); font-weight: 700; font-size: 14px; margin-top: 2px; }
  .t-add { border: 1px solid var(--accent); color: var(--accent); background: var(--panel); font-weight: 700;
    border-radius: 10px; width: 38px; height: 38px; font-size: 20px; cursor: pointer; flex-shrink: 0; }
  .t-add:active { background: var(--accent-soft); }
  .t-soldout { opacity: .5; }
  .t-cartbar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--accent); color: #fff;
    padding: 15px 18px; display: none; align-items: center; justify-content: space-between; cursor: pointer;
    box-shadow: 0 -6px 18px rgba(0,0,0,.14); }
  .t-cartbar .c-count { background: rgba(255,255,255,.25); border-radius: 999px; padding: 3px 10px; font-weight: 700; font-size: 13px; }
  .t-sheet { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 50; display: none; align-items: flex-end; }
  .t-sheet .panel { background: var(--panel); width: 100%; max-width: 640px; margin: 0 auto; border-radius: 20px 20px 0 0;
    max-height: 88vh; overflow-y: auto; padding: 20px 18px calc(20px + env(safe-area-inset-bottom)); }
  .t-line { display: flex; justify-content: space-between; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border-soft); }
  .t-step { display: inline-flex; align-items: center; gap: 10px; }
  .t-step button { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--border); background: var(--neutral-bg); font-size: 16px; font-weight: 700; }
  .t-big { width: 100%; padding: 15px; font-size: 16px; font-weight: 700; border-radius: 12px; border: none; background: var(--accent); color: #fff; }
  .t-center { text-align: center; padding: 60px 24px; }
</style>
</head>
<body>
  <div class="t-wrap" id="root">
    <div class="t-center" id="loading" style="color:var(--muted);">Loading menu…</div>
  </div>

  <div class="t-cartbar" id="cartBar">
    <span class="c-count" id="cartCount">0</span>
    <span>View order</span>
    <span id="cartTotal" style="font-weight:700;"></span>
  </div>

  <div id="toast" class="toast"></div>
  <script src="/table.js"></script>
</body>
</html>
