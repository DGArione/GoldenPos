<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Time Clock — Restaurant POS</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="navbar"></div>

  <div class="page-body narrow" style="max-width:480px; text-align:center; padding-top:50px;">
    <h2 style="margin-bottom:2px;" id="greeting">Hi there</h2>
    <div class="subtitle" style="margin-bottom:24px;" id="statusLine">Loading...</div>

    <div class="card" style="padding:30px;">
      <div id="clockDisplay" class="mono" style="font-size:34px; font-weight:700; margin-bottom:18px;">--:--:--</div>
      <button id="clockBtn" class="btn btn-primary" style="padding:16px 36px; font-size:16px;">Clock In</button>
    </div>

    <h3 style="margin-top:30px; text-align:left;">Recent Shifts</h3>
    <div id="shiftList" style="display:flex; flex-direction:column; gap:6px; text-align:left;"></div>
  </div>

  <script src="auth.js"></script>
  <script src="theme.js"></script>
  <script src="nav.js"></script>
  <script src="timeclock.js"></script>
</body>
</html>
