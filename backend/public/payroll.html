<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Payroll — Restaurant POS</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="navbar"></div>

  <div class="page-body narrow">
    <div class="page-header">
      <h2>Payroll Summary</h2>
      <div class="tabs" id="rangeTabs">
        <button class="tab" data-range="week">This Week</button>
        <button class="tab active" data-range="month">This Month</button>
        <button class="tab" data-range="all">All Time</button>
      </div>
    </div>

    <div id="clockedInBanner" style="display:none; margin-bottom:14px; padding:10px 14px; background:var(--success-bg); color:var(--success); border-radius:var(--radius-sm); font-size:13px;"></div>

    <table>
      <thead><tr><th>Staff</th><th>Hours</th><th>Pay Rate</th><th>Amount Due</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <script src="auth.js"></script>
  <script src="theme.js"></script>
  <script src="nav.js"></script>
  <script src="payroll.js"></script>
</body>
</html>
