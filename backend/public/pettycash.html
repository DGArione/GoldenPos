<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Petty Cash — Restaurant POS</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="navbar"></div>

  <div class="page-body narrow">
    <div class="page-header">
      <div>
        <h2>Petty Cash</h2>
        <div class="subtitle">Track small cash disbursements and top-ups for the drawer/float.</div>
      </div>
    </div>

    <div class="card" style="padding:20px; margin-bottom:24px; text-align:center;">
      <div style="font-size:12px; color:var(--muted);">Current Balance</div>
      <div id="balance" class="mono" style="font-size:32px; font-weight:700; margin-top:4px;">—</div>
    </div>

    <div class="card" style="padding:18px; margin-bottom:24px; display:flex; gap:8px; flex-wrap:wrap; align-items:flex-end;">
      <div style="flex:1; min-width:100px;">
        <div style="font-size:12px; font-weight:600; margin-bottom:4px;">Type</div>
        <select id="entryType"><option value="out">Cash Out</option><option value="in">Cash In (top-up)</option></select>
      </div>
      <div style="flex:1; min-width:100px;">
        <div style="font-size:12px; font-weight:600; margin-bottom:4px;">Amount</div>
        <input id="entryAmount" type="number" step="0.01" placeholder="0.00" />
      </div>
      <div style="flex:2; min-width:160px;">
        <div style="font-size:12px; font-weight:600; margin-bottom:4px;">Reason</div>
        <input id="entryReason" placeholder="e.g. bought ice, float top-up" />
      </div>
      <button id="addEntryBtn" class="btn btn-primary">+ Record</button>
    </div>

    <h3 style="margin-bottom:10px;">Ledger</h3>
    <table>
      <thead><tr><th>Date</th><th>Type</th><th>Reason</th><th>Recorded By</th><th style="text-align:right;">Amount</th></tr></thead>
      <tbody id="ledgerRows"></tbody>
    </table>
  </div>

  <div id="toast" class="toast"></div>
  <script src="auth.js"></script>
  <script src="theme.js"></script>
  <script src="nav.js"></script>
  <script src="pettycash.js"></script>
</body>
</html>
