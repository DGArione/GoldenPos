<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Branches — Restaurant POS</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="navbar"></div>

  <div class="page-body narrow">
    <div class="page-header"><h2>Branches</h2></div>

    <div class="card" style="padding: 18px; margin-bottom: 22px; display:flex; gap:8px; flex-wrap:wrap;">
      <input id="newName" placeholder="Branch name" style="flex:2;" />
      <input id="newAddress" placeholder="Address" style="flex:2;" />
      <button id="addBtn" class="btn btn-primary">+ Add Branch</button>
    </div>

    <div id="branchList" style="display:flex; flex-direction:column; gap:10px;"></div>
  </div>

  <div id="toast" class="toast"></div>
  <script src="auth.js"></script>
  <script src="theme.js"></script>
  <script src="nav.js"></script>
  <script src="branches.js"></script>
</body>
</html>
