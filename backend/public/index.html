<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Restaurant POS</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <script>
    if (!sessionStorage.getItem("posUser")) window.location.href = "login";
  </script>
  <div id="navbar"></div>

  <div class="page-body narrow" style="text-align:center; padding-top:60px;">
    <h1 style="margin-bottom: 4px;">Welcome back 👋</h1>
    <p style="color: var(--muted); margin-bottom: 28px;">Pick a screen to get started.</p>
    <div id="tiles" style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px;"></div>
  </div>

  <script src="auth.js"></script>
  <script src="theme.js"></script>
  <script src="nav.js"></script>
  <script>
    const staff = requireLogin();
    if (staff) {
      renderNav("", staff);
      const allowed = ROLE_VISIBILITY[staff.role] || [];
      document.getElementById("tiles").innerHTML = NAV_ITEMS.filter((i) => allowed.includes(i.key)).map((i) => `
        <a class="card clickable" href="${i.href}" style="padding: 22px 16px; text-decoration:none; color:var(--text); display:flex; flex-direction:column; align-items:center; gap:8px;">
          <span style="color:var(--accent);">${svgIcon(i.icon, 24)}</span>
          <strong style="font-size:14px;">${i.label}</strong>
        </a>`).join("");
    }
  </script>
</body>
</html>
