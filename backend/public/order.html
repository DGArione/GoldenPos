<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Order Entry — Restaurant POS</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="navbar"></div>

  <div class="page-body page-body--fullscreen">

    <!-- Top bar: order type + table + search -->
    <div style="display:flex; align-items:center; gap:14px; padding:14px 20px; border-bottom:1px solid var(--border); flex-wrap:wrap; flex-shrink:0;">
      <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
        <div class="seg" id="orderTypeSeg">
          <button data-type="dine-in">Dine-in</button>
          <button data-type="takeaway">Take Away</button>
          <button data-type="delivery">Delivery</button>
        </div>
        <span class="table-flag" id="tableFlag" style="display:none;">
          <span id="tableFlagName"></span>
          <button id="tableFlagClear" title="Remove table — this becomes a walk-in order">×</button>
        </span>
        <a href="floor" id="changeTableLink" style="font-size:12px; color:var(--muted); text-decoration:none;">tables →</a>
      </div>
      <div style="margin-left:auto; display:flex; gap:8px;">
        <button id="custLookupBtn" class="btn" style="font-size:12px;" title="Attach a customer to this order (optional) — search the directory or add a new one">👤 Customer</button>
        <button id="kotToggleBtn" class="btn" style="font-size:12px;" title="Auto-print a KOT to each station printer when an order is sent">🖨️ KOT: On</button>
        <button id="resetOrderNumBtn" class="btn" style="font-size:12px; display:none;" title="Reset order number counter">🔄 Reset #</button>
        <button id="stockCheckBtn" class="btn" style="font-size:12px;">📋 Stock Check</button>
        <input id="searchInput" placeholder="🔍 Search menu..." style="width:180px;" />
        <input id="pluInput" placeholder="PLU code ↵" class="mono" style="width:120px;" />
      </div>
    </div>

    <div id="customerRow" style="display:none; padding: 10px 20px; gap:8px; flex-wrap:wrap; align-items:center; border-bottom:1px solid var(--border); flex-shrink:0;">
      <input id="custName" placeholder="Customer name (optional)" style="flex:1; min-width:140px;" />
      <input id="custPhone" placeholder="Customer phone" style="flex:1; min-width:140px;" />
      <input id="custAddress" placeholder="Delivery address (if applicable)" style="flex:2; min-width:180px;" />
      <span id="custHistoryTag" style="font-size:11px; color:var(--muted); align-self:center;"></span>
      <button id="custClearBtn" class="btn btn-sm" style="font-size:11px; display:none;" title="Detach customer from this order">✕ Clear</button>
    </div>

    <!-- Main 3-column area -->
    <div style="display:flex; flex:1; overflow:hidden;">

      <!-- Category rail -->
      <div id="categoryRail" style="width:150px; flex-shrink:0; overflow-y:auto; border-right:1px solid var(--border-soft); padding:10px 8px; display:flex; flex-direction:column; gap:4px;"></div>

      <!-- Menu grid -->
      <div id="menuGrid" style="flex:1; overflow-y:auto; padding: 16px; display:grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; align-content:start;"></div>

      <!-- Cart -->
      <div class="card" style="width: 340px; flex-shrink:0; border-radius: 0; border-top: none; border-bottom: none; border-right: none; display:flex; flex-direction:column; box-shadow:none;">
        <div class="ticket-header" style="display:flex; justify-content:space-between; align-items:center;">
          <span>🎫 Current Order</span>
          <div style="display:flex; gap:6px;">
            <button id="recallBtn" class="btn" style="font-size:11px; padding:4px 8px;">Recall</button>
            <button id="holdBtn" class="btn" style="font-size:11px; padding:4px 8px;">Hold</button>
            <button id="priorityBtn" class="btn" style="font-size:11px; padding:4px 8px;">🔥 Priority</button>
          </div>
        </div>

        <div id="cartItems" style="flex:1; overflow-y:auto; padding: 4px 16px;"></div>

        <div style="padding: 8px 16px 0;">
          <textarea id="ticketNote" placeholder="📝 Ticket note (e.g. birthday, allergy, rush)..." rows="2" style="width:100%; font-size:12px; padding:7px; resize:none;"></textarea>
        </div>

        <div class="mono" style="padding: 12px 16px; border-top: 1px solid var(--border); font-size: 14px;">
          <div style="display:flex; justify-content:space-between; color:var(--muted);"><span>Subtotal</span><span id="subtotal">$0.00</span></div>
          <div id="promoLine" style="display:none; justify-content:space-between; color:var(--accent); font-weight:600;"><span id="promoLineLabel">Promo</span><span id="promoLineAmt"></span></div>
          <div style="display:flex; justify-content:space-between; color:var(--muted);"><span id="scLabel">Service Charge</span><span id="serviceCharge">$0.00</span></div>
          <div style="display:flex; justify-content:space-between; color:var(--muted);"><span id="vatLabel">VAT</span><span id="vat">$0.00</span></div>
          <div style="display:flex; justify-content:space-between; font-weight:700; font-size:19px; padding-top:6px;"><span>Total</span><span id="total">$0.00</span></div>
        </div>
        <div style="display:flex; gap:8px; margin:12px 16px 16px;">
          <button id="sendKitchenBtn" class="btn" style="flex:1; padding:15px 8px; font-size:13.5px;" disabled
            title="Send to kitchen and stay on this screen  (F2)">Send to Kitchen</button>
          <button id="sendPayBtn" class="btn btn-primary" style="flex:1.35; padding:15px 8px; font-size:15px;" disabled
            title="Send to kitchen and go to Payment  (F4 / Ctrl+Enter)">Send &amp; Pay →</button>
        </div>
        <div style="margin:-8px 16px 14px; text-align:center;">
          <button id="kbHelpBtn" class="btn btn-ghost btn-sm" style="font-size:11px; color:var(--muted);" title="Keyboard shortcuts">⌨ Shortcuts (press ?)</button>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>
  <script src="auth.js"></script>
  <script src="theme.js"></script>
  <script src="nav.js"></script>
  <script src="printing.js"></script>
  <script src="order.js"></script>
</body>
</html>
