<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Promotions — Restaurant POS</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="navbar"></div>
  <div class="page-body">
    <div class="page-header">
      <div>
        <h2>Promotions</h2>
        <div class="subtitle">When more than one deal fits an order, the best-value one applies.</div>
      </div>
      <button id="newPromoBtn" class="btn btn-primary">New promotion</button>
    </div>

    <div id="promoReport" style="display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:12px; margin-bottom:22px;"></div>

    <div id="promoList"></div>
  </div>
  <div id="toast" class="toast"></div>
  <script src="auth.js"></script>
  <script src="theme.js"></script>
  <script src="nav.js"></script>
  <script src="promotions.js"></script>
</body>
</html>
