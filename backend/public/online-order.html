<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Order Online</title>
<link rel="stylesheet" href="/style.css" />
<style>
  body { background: var(--bg); }
  .o-wrap { max-width: 720px; margin: 0 auto; padding: 0 0 130px; }
  .o-header { position: sticky; top: 0; z-index: 10; background: var(--panel); border-bottom: 1px solid var(--border);
    padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .o-header .biz { font-weight: 700; font-size: 17px; }
  .o-header select { max-width: 50%; }
  .o-types { display: flex; gap: 8px; padding: 12px 18px 4px; }
  .o-type { flex: 1; border: 1px solid var(--border); background: var(--panel); color: var(--text);
    border-radius: 12px; padding: 11px; font-weight: 700; font-size: 14px; cursor: pointer; }
  .o-type.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .o-chips { display: flex; gap: 8px; overflow-x: auto; padding: 12px 18px; position: sticky; top: 57px; background: var(--bg); z-index: 9; }
  .o-chip { white-space: nowrap; border: 1px solid var(--border); background: var(--panel); color: var(--text);
    border-radius: 999px; padding: 7px 14px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .o-chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .o-item { display: flex; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--border-soft); align-items: center; }
  .o-item .thumb { width: 58px; height: 58px; border-radius: 12px; background: var(--neutral-bg); flex-shrink: 0; background-size: cover; background-position: center; }
  .o-item .nm { font-weight: 600; font-size: 15px; }
  .o-item .pr { color: var(--accent); font-weight: 700; font-size: 14px; margin-top: 2px; }
  .o-add { border: 1px solid var(--accent); color: var(--accent); background: var(--panel); font-weight: 700;
    border-radius: 10px; width: 38px; height: 38px; font-size: 20px; cursor: pointer; flex-shrink: 0; }
  .o-soldout { opacity: .5; }
  .o-bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--accent); color: #fff; max-width: 720px; margin: 0 auto;
    padding: 15px 18px; display: none; align-items: center; justify-content: space-between; cursor: pointer; box-shadow: 0 -6px 18px rgba(0,0,0,.14); }
  .o-bar .cnt { background: rgba(255,255,255,.25); border-radius: 999px; padding: 3px 10px; font-weight: 700; font-size: 13px; }
  .o-sheet { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 50; display: none; align-items: flex-end; }
  .o-sheet .panel { background: var(--panel); width: 100%; max-width: 720px; margin: 0 auto; border-radius: 20px 20px 0 0;
    max-height: 90vh; overflow-y: auto; padding: 20px 18px calc(20px + env(safe-area-inset-bottom)); }
  .o-line { display: flex; justify-content: space-between; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border-soft); }
  .o-step { display: inline-flex; align-items: center; gap: 10px; }
  .o-step button { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--border); background: var(--neutral-bg); font-size: 16px; font-weight: 700; }
  .o-big { width: 100%; padding: 15px; font-size: 16px; font-weight: 700; border-radius: 12px; border: none; background: var(--accent); color: #fff; }
  .o-center { text-align: center; padding: 56px 24px; }
  .o-f { margin-bottom: 12px; }
  .o-f label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; }
  .o-f input, .o-f textarea { width: 100%; padding: 11px 13px; border: 1px solid var(--border); border-radius: 10px; font-size: 15px; font-family: inherit; background: var(--neutral-bg); color: var(--text); }
</style>
</head>
<body>
  <div class="o-wrap" id="root">
    <div class="o-center" id="loading" style="color:var(--muted);">Loading menu…</div>
  </div>
  <div class="o-bar" id="cartBar">
    <span class="cnt" id="cartCount">0</span><span>View order</span><span id="cartTotal" style="font-weight:700;"></span>
  </div>
  <div id="toast" class="toast"></div>
  <script src="/online-order.js"></script>
</body>
</html>
